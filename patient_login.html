{% extends "base.html" %}
{% block title %}Patient Login — Apollo HMS{% endblock %}
{% block content %}
<div style="max-width:420px;margin:32px auto;">
  <div class="page-header" style="text-align:center;">
    <h1>Patient Login</h1>
    <p>Use your SRF ID and date of birth to sign in</p>
  </div>
  <div class="card">
    <div class="card-title">Patient Authentication</div>
    <form method="POST">
      <div class="form-group" style="margin-bottom:14px;">
        <label>SRF ID</label>
        <input type="text" name="srfid" placeholder="e.g. SRF20220001" required/>
      </div>
      <div class="form-group" style="margin-bottom:22px;">
        <label>Date of Birth <span style="color:var(--muted);font-weight:400;">(acts as your password)</span></label>
        <input type="date" name="dob" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--muted);">
      New patient? <a href="/patient/register" style="color:var(--primary);font-weight:600;">Create account</a>
    </p>
  </div>
</div>
{% endblock %}
