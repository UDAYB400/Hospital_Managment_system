{% extends "base.html" %}
{% block title %}Hospital Registration — Apollo HMS{% endblock %}
{% block content %}
<div style="max-width:600px;margin:32px auto;">
  <div class="page-header" style="text-align:center;">
    <h1>Hospital Registration</h1>
    <p>Register your hospital to start managing patients and doctors</p>
  </div>
  <div class="card">
    <div class="card-title">Hospital Details</div>
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Hospital Code</label>
          <input type="text" name="hcode" placeholder="Unique code e.g. APL001" required/>
        </div>
        <div class="form-group">
          <label>Hospital Name</label>
          <input type="text" name="hname" placeholder="e.g. Apollo Hospital Chennai" required/>
        </div>
        <div class="form-group">
          <label>Admin Email</label>
          <input type="email" name="email" placeholder="admin@hospital.com" required/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required/>
        </div>
      </div>
      <div class="section-title" style="margin-top:20px;">Bed Inventory</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Normal Beds</label>
          <input type="number" name="normalbed" placeholder="0" min="0" required/>
        </div>
        <div class="form-group">
          <label>HICU Beds</label>
          <input type="number" name="hicubed" placeholder="0" min="0" required/>
        </div>
        <div class="form-group">
          <label>ICU Beds</label>
          <input type="number" name="icubed" placeholder="0" min="0" required/>
        </div>
        <div class="form-group">
          <label>Ventilator Beds</label>
          <input type="number" name="vbed" placeholder="0" min="0" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:22px;">Register Hospital</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--muted);">
      Already registered? <a href="/hospital/login" style="color:var(--primary);font-weight:600;">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
