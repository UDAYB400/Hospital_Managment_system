{% extends "base.html" %}
{% block title %}Hospital Login — Apollo HMS{% endblock %}
{% block content %}
<div style="max-width:420px;margin:32px auto;">
  <div class="page-header" style="text-align:center;">
    <h1>Hospital Login</h1>
    <p>Access your hospital management panel</p>
  </div>
  <div class="card">
    <div class="card-title">Hospital Authentication</div>
    <form method="POST">
      <div class="form-group" style="margin-bottom:14px;">
        <label>Hospital Code</label>
        <input type="text" name="hcode" placeholder="e.g. ARK123" required/>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="admin@hospital.com" required/>
      </div>
      <div class="form-group" style="margin-bottom:22px;">
        <label>Password</label>
        <input type="password" name="password" placeholder="Your password" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Login to Panel</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--muted);">
      New hospital? <a href="/hospital/register" style="color:var(--primary);font-weight:600;">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
