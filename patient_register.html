{% extends "base.html" %}
{% block title %}Patient Registration — Apollo HMS{% endblock %}
{% block content %}
<div style="max-width:580px;margin:32px auto;">
  <div class="page-header" style="text-align:center;">
    <h1>Patient Registration</h1>
    <p>Create your account to access Apollo Hospital services</p>
  </div>
  <div class="card">
    <div class="card-title">New Patient Account</div>
    <form method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>SRF ID</label>
          <input type="text" name="srfid" placeholder="e.g. SRF20220001" required/>
        </div>
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="pname" placeholder="Your full name" required/>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="you@email.com" required/>
        </div>
        <div class="form-group">
          <label>Date of Birth <span style="color:var(--muted);font-weight:400;">(used as password)</span></label>
          <input type="date" name="dob" required/>
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" name="pphone" placeholder="10-digit number" maxlength="12" required/>
        </div>
        <div class="form-group">
          <label>Hospital Code <span style="color:var(--muted);font-weight:400;">(optional)</span></label>
          <input type="text" name="hcode" placeholder="e.g. ARK123"/>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:20px;">Create Account</button>
    </form>
    <p style="text-align:center;margin-top:16px;font-size:0.82rem;color:var(--muted);">
      Already registered? <a href="/patient/login" style="color:var(--primary);font-weight:600;">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
